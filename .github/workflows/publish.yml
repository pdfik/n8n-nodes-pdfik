name: Publish to npm

# Publishes with npm trusted publishing (OIDC) and provenance: no npm token is stored
# in this repository. The trusted publisher for @pdfik/n8n-nodes-pdfik must name this
# repository and this workflow file on npmjs.com.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer. Pinned to the npm the lockfile is checked with
      # (node:24-bookworm-slim in tools/verify/docker-checks.sh n8nnode): npm 11.6.2 on Node 22
      # rejected this lockfile (2026-11-19, nested ignore@5.3.2).
      - name: Update npm
        run: npm install -g npm@11.19.1

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
